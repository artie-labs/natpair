<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Monthly cost comparison chart: AWS NAT Gateway scales linearly at $0.045 per GB from $36.50, while natpair stays flat at $75 for c7g.medium (cheaper above 850 GB), $113 for c7gn.medium (cheaper above 1.7 TB), and $204 for c7gn.large (cheaper above 3.7 TB)">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .subtitle { font-size: 11.5px; fill: #59636e; }
    .tick { font-size: 11px; fill: #59636e; }
    .axis-title { font-size: 11.5px; font-weight: 500; fill: #59636e; }
    .series-name { font-size: 11.5px; font-weight: 600; }
    .series-val { font-size: 10.5px; fill: #59636e; }
    .breakeven { font-size: 10.5px; font-weight: 600; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    .axis { stroke: #8c959f; stroke-width: 1; }
  </style>

  <rect width="760" height="310" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="20" y="25" class="title">Monthly cost: natpair vs AWS NAT Gateway</text>
  <text x="20" y="42" class="subtitle">us-east-1 on-demand, 1 availability zone, Nov 2026 (excludes AWS internet egress transfer, which is the same for both)</text>

  <!-- Horizontal gridlines ($0 to $400, 0.5 px/$ from y=262 to y=62) -->
  <line x1="68" y1="62" x2="604" y2="62" class="grid"/>
  <line x1="68" y1="112" x2="604" y2="112" class="grid"/>
  <line x1="68" y1="162" x2="604" y2="162" class="grid"/>
  <line x1="68" y1="212" x2="604" y2="212" class="grid"/>
  <line x1="68" y1="262" x2="604" y2="262" class="axis"/>
  <line x1="68" y1="62" x2="68" y2="262" class="axis"/>

  <!-- Y ticks -->
  <text x="60" y="66" text-anchor="end" class="tick">$400</text>
  <text x="60" y="116" text-anchor="end" class="tick">$300</text>
  <text x="60" y="166" text-anchor="end" class="tick">$200</text>
  <text x="60" y="216" text-anchor="end" class="tick">$100</text>
  <text x="60" y="266" text-anchor="end" class="tick">$0</text>

  <!-- X ticks (0 to 8 TB, 67 px/TB: 68 + tb*67) -->
  <text x="68" y="280" text-anchor="middle" class="tick">0 TB</text>
  <text x="202" y="280" text-anchor="middle" class="tick">2 TB</text>
  <text x="336" y="280" text-anchor="middle" class="tick">4 TB</text>
  <text x="470" y="280" text-anchor="middle" class="tick">6 TB</text>
  <text x="604" y="280" text-anchor="middle" class="tick">8 TB</text>
  <text x="336" y="299" text-anchor="middle" class="axis-title">Monthly traffic processed through NAT</text>

  <!-- Break-even drop lines -->
  <!-- 0.856 TB -> x=125.3, y=224.5 -->
  <line x1="125.3" y1="224.5" x2="125.3" y2="262" stroke="#1a7f37" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- 1.70 TB -> x=181.9, y=205.5 -->
  <line x1="181.9" y1="205.5" x2="181.9" y2="262" stroke="#0969da" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- 3.722 TB -> x=317.4, y=160.0 -->
  <line x1="317.4" y1="160.0" x2="317.4" y2="262" stroke="#8250df" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Flat natpair lines -->
  <!-- 2 x c7gn.large: $204 -> y=160.0 -->
  <line x1="68" y1="160.0" x2="604" y2="160.0" stroke="#8250df" stroke-width="2.25"/>
  <!-- 2 x c7gn.medium: $113 -> y=205.5 -->
  <line x1="68" y1="205.5" x2="604" y2="205.5" stroke="#0969da" stroke-width="2.25"/>
  <!-- 2 x c7g.medium: $75 -> y=224.5 -->
  <line x1="68" y1="224.5" x2="604" y2="224.5" stroke="#1a7f37" stroke-width="2.25"/>

  <!-- AWS NAT Gateway line: 0 TB=$36.50 (y=243.75) to 8 TB=$396.50 (y=63.75) -->
  <line x1="68" y1="243.75" x2="604" y2="63.75" stroke="#cf222e" stroke-width="2.5"/>

  <!-- Break-even dots and labels -->
  <circle cx="125.3" cy="224.5" r="4" fill="#1a7f37" stroke="#ffffff" stroke-width="1.5"/>
  <text x="115" y="219" text-anchor="end" class="breakeven" fill="#1a7f37">850 GB</text>

  <circle cx="181.9" cy="205.5" r="4" fill="#0969da" stroke="#ffffff" stroke-width="1.5"/>
  <text x="174" y="195" text-anchor="end" class="breakeven" fill="#0969da">1.7 TB</text>

  <circle cx="317.4" cy="160.0" r="4" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <text x="308" y="149" text-anchor="end" class="breakeven" fill="#8250df">3.7 TB</text>

  <!-- Direct right-side labels -->
  <text x="614" y="64" class="series-name" fill="#cf222e">AWS NAT Gateway</text>
  <text x="614" y="78" class="series-val">$36.50 + $0.045/GB</text>

  <text x="614" y="159" class="series-name" fill="#8250df">2 × c7gn.large</text>
  <text x="614" y="173" class="series-val">~$204/mo flat</text>

  <text x="614" y="201" class="series-name" fill="#0969da">2 × c7gn.medium</text>
  <text x="614" y="215" class="series-val">~$113/mo flat</text>

  <text x="614" y="237" class="series-name" fill="#1a7f37">2 × c7g.medium</text>
  <text x="614" y="251" class="series-val">~$75/mo flat</text>
</svg>
