version: "2"

linters:
  default: standard
  enable:
    - usetesting
  settings:
    errcheck:
      exclude-functions:
        # A failed response write has no recovery. The client sees the error.
        - (net/http.ResponseWriter).Write
      verbose: true
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1008"]
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: false
  exclusions:
    rules:
      - linters:
        - errcheck
        source: "^\\s*defer\\s+"
    paths:
        - internal/mocks/*

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/artie-labs/natpair
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/artie-labs/natpair
