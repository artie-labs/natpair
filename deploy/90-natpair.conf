# Forwarding stays off at boot until natpair-bootstrap installs the fence.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0
# Worker traffic arrives on the shared ENI, but replies to workers leave
# through the primary interface, so reverse-path filtering would drop it. This
# file sorts after the system defaults, so these lines win whenever sysctl
# settings are reapplied, and new interfaces start with filtering off.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.*.rp_filter = 0
