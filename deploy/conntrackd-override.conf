# conntrackd reads the configuration that natpair bootstrap writes, so it
# starts after bootstrap. Its lock file is in /var/lib/natpair, so a stale
# one is removed there instead of at the default path.
[Unit]
Requires=natpair-bootstrap.service
After=natpair-bootstrap.service
StartLimitIntervalSec=0

[Service]
ExecStartPre=
ExecStartPre=/bin/rm -f /var/lib/natpair/conntrackd.lock
ExecStart=
ExecStart=/usr/sbin/conntrackd -C /var/lib/natpair/conntrackd.conf
Restart=always
RestartSec=1
